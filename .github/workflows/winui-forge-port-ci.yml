name: WinUI Forge Port CI

on:
  push:
    branches:
      - "winui-forge/**"
      - "chatgpt/**"
    paths:
      - "src/WinUIForge.Port.*/**"
      - "tests/WinUIForge.Port.*/**"
      - "samples/VerticalSlice/**"
      - "WinUIForge.Port.slnx"
      - "build-port.ps1"
      - ".github/workflows/winui-forge-port-ci.yml"
  pull_request:
    paths:
      - "src/WinUIForge.Port.*/**"
      - "tests/WinUIForge.Port.*/**"
      - "samples/VerticalSlice/**"
      - "WinUIForge.Port.slnx"
      - "build-port.ps1"
      - ".github/workflows/winui-forge-port-ci.yml"
  workflow_dispatch:

jobs:
  build-port-proof:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test and build WinUI 3 vertical slice
        shell: pwsh
        run: .\build-port.ps1 -Configuration Release
